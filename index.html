<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알람 웹앱</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="news/news.css">
</head>
<body>
  <div id="memo-layer"></div>

  <div class="app">
    <button id="memo-add-btn" class="memo-add-btn" title="메모 추가">📝</button>
    <img src="images/알람images.jpg" alt="알람 캐릭터" class="app-banner">
    <h1>⏰ 알람</h1>

    <div class="weather" id="weather">날씨 불러오는 중...</div>

    <div class="clock" id="clock">00:00:00</div>

    <form id="alarm-form" class="alarm-form">
      <input type="time" id="alarm-time" step="1" required>
      <input type="text" id="alarm-label" placeholder="알람 이름 (선택)" maxlength="30">
      <button type="submit">추가</button>
    </form>

    <ul id="alarm-list" class="alarm-list"></ul>

    <button id="save-now-btn" class="save-now-btn" type="button">💾 지금 저장</button>
    <div id="save-status" class="save-status"></div>

    <button id="news-briefing-btn" class="news-briefing-btn" type="button">📰 최근뉴스</button>
    <ul id="news-list" class="news-list"></ul>
  </div>

  <div id="ringing-overlay" class="overlay hidden">
    <div class="overlay-box">
      <p id="ringing-label">알람!</p>
      <ul id="news-briefing-cards" class="news-list news-briefing-cards"></ul>
      <button id="stop-btn">중지</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <script src="memo.js"></script>
  <script src="news/news.js"></script>
</body>
</html>
